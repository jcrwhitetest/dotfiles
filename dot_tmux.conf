# ================================
# tmux.conf — One Dark Pro starting point (Linux side of the dotfiles)
# Prepared for the Proxmox VMs; review before applying.
# ================================

# --- Prefix: Ctrl-a (easier reach than the default Ctrl-b) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General behaviour ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
setw -g mode-keys vi

# --- Truecolor / 256 color ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"

# --- Reload config with prefix + r ---
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- Splits keep the current path; vim-style pane navigation ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ================================
# One Dark Pro theme (matches the Oh My Posh palette)
#   bg #282c34   fg #abb2bf   blue #61afef   green #98c379
#   purple #c678dd   gray #5c6370   red #e06c75   surface #3e4451
# ================================
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#282c34,fg=#abb2bf"

set -g status-left-length 40
set -g status-left "#[fg=#282c34,bg=#c678dd,bold] #S #[fg=#c678dd,bg=#282c34] "

set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=#e06c75]● PREFIX ,}#[fg=#61afef]%Y-%m-%d #[fg=#98c379]%H:%M "

setw -g window-status-format "#[fg=#5c6370] #I:#W "
setw -g window-status-current-format "#[fg=#282c34,bg=#61afef,bold] #I:#W #[fg=#61afef,bg=#282c34]"

set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"

set -g message-style "bg=#61afef,fg=#282c34,bold"
set -g mode-style "bg=#3e4451,fg=#dcdfe4"
